[project]
name = "managed_futures"
version = "0.1.0"
description = "Systematic managed futures research framework"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "openpyxl",
    "statsmodels",
    "matplotlib",
    "markdown",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]
notebook = ["matplotlib", "ipykernel", "nbformat", "nbconvert"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
# Moved from qps-baseline as-is; see TODO "Lint and split the qps modules".
extend-exclude = [
    "scripts/audit_*.py",
    "scripts/construct_returns.py",
    "scripts/eda.py",
    "scripts/export_report.py",
    "scripts/research_report.py",
    "scripts/review_endpoints.py",
    "scripts/run_research.py",
    "scripts/run_risk_research.py",
    "scripts/verify_legacy.py",
    "src/backtest/engine.py",
    "src/backtest/research_statistics.py",
    "src/data_processing/endpoint_sensitivity.py",
    "src/data_processing/strategy_inputs.py",
    "src/risk_model/risk_model.py",
    "tests/backtest/test_*.py",
    "tests/data_processing/test_endpoint_sensitivity.py",
    "tests/risk_model/test_risk_model.py",
]
